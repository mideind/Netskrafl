# Alembic configuration for the PostgreSQL backend.
#
# The database URL is NOT configured here; it is read from the
# DATABASE_URL environment variable by migrations/env.py (falling back
# to the DatabaseConfig defaults in src/db/config.py).
#
# Usage:
#   DATABASE_URL=postgresql://... venv/bin/alembic upgrade head
#   DATABASE_URL=postgresql://... venv/bin/alembic revision --autogenerate -m "..."
#
# For a database whose schema was originally created with
# Base.metadata.create_all() (e.g. an existing test database), mark it
# as up to date without running the initial migration:
#   DATABASE_URL=postgresql://... venv/bin/alembic stamp head

[alembic]
script_location = migrations
prepend_sys_path = . src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
