# Digital Ocean App Platform spec for the Explo production backend.
#
# Reference copy with placeholders, like app.yaml (the staging app, which
# explains each setting at length) and app-netskrafl.yaml (the Netskrafl
# production app) next to it; only the differences are commented here. The
# same rules apply:
#
# - Never commit real values. Everything marked REPLACE_ME is entered when the
#   app is created; values of `type: SECRET` are stored encrypted and read back
#   as opaque `EV[1:...]` ciphertext that is bound to the one app.
# - Never apply this file to the live app: it would overwrite the secrets with
#   the placeholders. Change the live app by round-tripping its own spec:
#
#     doctl apps spec get <APP_ID> > live-spec.yaml
#     # edit, leaving every EV[1:...] value untouched
#     doctl apps update <APP_ID> --spec live-spec.yaml
#
# See doc/operations.md for how the deployments run.

name: replace-me-app-name
region: ams

# The live spec carries the backend's public API hostname as its primary
# domain (since 2026-11-26): Explo apps from version 1.5.1 have that hostname
# built in and reach this app directly. Older apps call the App Engine
# address, where the forwarding app (appspot-forward/) passes every request
# on to this app's default hostname. When a hostname is added to an app, add
# it to the spec BEFORE its DNS record is pointed at the app: added after the
# record has changed, App Platform answers 404 for the hostname in the
# meantime. Then leave the spec alone until the domain is active.
domains:
- domain: REPLACE_ME_public_api_hostname
  type: PRIMARY

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

ingress:
  rules:
    - component:
        name: explo
      match:
        path:
          prefix: /

services:
  - name: explo

    dockerfile_path: /Dockerfile
    source_dir: /

    github:
      repo: mideind/Netskrafl
      # A dedicated branch, so that an ordinary push to master cannot
      # redeploy production, and so that Explo and Netskrafl are released
      # separately. It only ever points at a commit of master.
      branch: do-explo
      deploy_on_push: true

    http_port: 8080

    # One instance only: supercronic runs in every container (two instances
    # would run every scheduled job twice) and the entrypoint runs Alembic at
    # every start. Scale by instance size, not count. The size below was
    # chosen generously and can be lowered once metrics justify it.
    instance_count: 1
    instance_size_slug: apps-d-2vcpu-4gb

    health_check:
      http_path: /health/ready
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3

    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 2
        window: FIVE_MINUTES

    # Runtime logs are kept only briefly by the platform (about two hours
    # at busy times, and a container's log is gone once it is replaced):
    # forward them. The container writes one JSON entry per line, which the
    # log service indexes as it is (see doc/logging.md). The endpoint is the
    # log intake of the service's EU site. The API key is a secret of the
    # log service's organization, and unlike the SECRET values below the
    # platform does NOT encrypt it: the live spec holds it in plain text.
    # Treat every copy of a live spec as a secret (see doc/logging.md).
    # log_destinations:
    #   - name: datadog
    #     datadog:
    #       endpoint: https://http-intake.logs.datadoghq.eu
    #       api_key: REPLACE_ME

    envs:
      # PROJECT_ID=explo-live selects the Explo production configuration:
      # all locales, logins from the mobile apps, per-locale ratings served
      # live (so no ENABLE_RATINGS: the old-style rating tables are
      # Netskrafl's).
      - key: PROJECT_ID
        scope: RUN_AND_BUILD_TIME
        value: explo-live

      # The backend serves no web UI of its own (no SINGLE_PAGE: the built-in
      # UI is a development client, for the staging app and local servers).
      # A browser that opens its root or greeting page is sent here instead,
      # to Explo's website.
      - key: HOME_REDIRECT_URL
        scope: RUN_TIME
        value: https://explowordgame.com

      # The release name (nYYYYMMDD or eYYYYMMDD, see the /deploy skill):
      # cache-busts the static files and names the git tag of the release.
      - key: APP_VERSION
        scope: RUN_AND_BUILD_TIME
        value: REPLACE_ME_release_name

      # A key of the explo-live project's service account, minted for this
      # app alone so that it can be revoked on its own. Used by the Firebase
      # Admin SDK.
      - key: GOOGLE_CREDENTIALS_BASE64
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_base64_service_account_json

      # The production Valkey cluster, with the logical database assigned to
      # Explo as a /N suffix (see app.yaml for the tenant assignment). The
      # cache holds little on the PostgreSQL backend (the sets of online
      # users and a few short-lived results), so no cluster is created for
      # it. If the app is not in the same team and private network as the
      # cluster, this must be the cluster's public hostname. Meant to go
      # away: once the PostgreSQL backend can do without Redis, this
      # variable is removed here and in the other two specs.
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_rediss_url_with_db_number

      # The three application secrets. Sessions, the login tokens exchanged
      # with the host site and the bearer tokens held by clients are all
      # signed with them, so changing one signs everybody out: they kept
      # their values through the move from App Engine for that reason.
      - key: SECRETS_PROVIDER
        scope: RUN_TIME
        value: env

      - key: SECRET_KEY_BIN_BASE64
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_base64_64_raw_bytes

      - key: MOVES_AUTH_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_moves_auth_key

      - key: CLIENT_SECRET_EXPLO_LIVE_BASE64
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME_base64_client_secret_json

      # FIREBASE_DB_URL is not set: it is read from the client secret.

      # Set on the live app. Without it supercronic does not start, so no
      # scheduled job runs, and /cacheflush and /appversion cannot be called.
      # It is commented out here so that an app created from this file starts
      # without scheduled jobs: two backends must never run the nightly
      # statistics job for the same day on data that is then merged. Setting
      # it restarts the app.
      # - key: CRON_SECRET
      #   scope: RUN_TIME
      #   type: SECRET
      #   value: REPLACE_ME_random_string

      - key: MOVES_SIDECAR_PORT
        scope: RUN_TIME
        value: "8090"

      - key: DATABASE_BACKEND
        scope: RUN_AND_BUILD_TIME
        value: postgresql

      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${pg.DATABASE_URL}

# The production PostgreSQL cluster. Attaching it here provides the
# ${pg.DATABASE_URL} binding, but does NOT add the app to the cluster's
# trusted sources: until that is done, the container cannot connect, the
# entrypoint's Alembic step fails and so does the deployment. Right after
# creating the app:
#
#   doctl databases firewalls append <CLUSTER_ID> --rule app:<APP_ID>
#   doctl apps create-deployment <APP_ID>
databases:
  - name: pg
    engine: PG
    cluster_name: REPLACE_ME_production_cluster_name
    db_name: REPLACE_ME_database_name
    db_user: REPLACE_ME_database_user
    production: true
